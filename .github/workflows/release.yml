name: Release

on:
  push:
    tags:
      - "*.*.*-*.*.*-v*.*.*"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install ruff

      - run: ruff check .

      - run: ruff format --check .

  build-push:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Parse tag
        id: tag
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          PULUMI_VERSION=$(echo "$TAG" | cut -d'-' -f1)
          PROXMOXVE_VERSION=$(echo "$TAG" | cut -d'-' -f2)
          PROJECT_VERSION_RAW=$(echo "$TAG" | cut -d'-' -f3)
          PROJECT_VERSION=${PROJECT_VERSION_RAW#v}
          echo "tag=$TAG"                             >> "$GITHUB_OUTPUT"
          echo "pulumi_version=$PULUMI_VERSION"       >> "$GITHUB_OUTPUT"
          echo "proxmoxve_version=$PROXMOXVE_VERSION" >> "$GITHUB_OUTPUT"
          echo "project_version=$PROJECT_VERSION"     >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            PULUMI_VERSION=${{ steps.tag.outputs.pulumi_version }}
            PROXMOXVE_VERSION=${{ steps.tag.outputs.proxmoxve_version }}
            PROJECT_VERSION=${{ steps.tag.outputs.project_version }}
          tags: |
            ghcr.io/lightvik/pulumi-proxmoxve:${{ steps.tag.outputs.tag }}
            ghcr.io/lightvik/pulumi-proxmoxve:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
